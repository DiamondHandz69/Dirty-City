<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DIRTY CITY — NIGHT DRIVE</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080915;color:#fff;font:600 14px system-ui}canvas{display:block;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#brand{position:absolute;top:18px;left:18px;font-weight:1000;font-size:clamp(23px,4vw,43px);font-style:italic;letter-spacing:-2px;color:#ffc85d;text-shadow:3px 4px #c1263e,0 0 22px #ff4a34}#info{position:absolute;top:80px;left:18px;background:#070b18cc;border-left:3px solid #ffc85d;padding:10px 14px;max-width:290px;font-size:12px;line-height:1.6}#objective{color:#ffd67e}#status{position:absolute;right:14px;top:18px;background:#070b18cc;padding:9px 13px;border:1px solid #ffba5377}#bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#080a18aa;padding:8px 16px;border-radius:9px;white-space:nowrap;font-size:11px}#pad{position:absolute;bottom:24px;left:20px;display:grid;grid-template-columns:repeat(3,55px);gap:5px;pointer-events:auto}#pad button:nth-child(1){grid-column:2}#pad button:nth-child(2){grid-column:1;grid-row:2}#pad button:nth-child(3){grid-column:2;grid-row:2}#pad button:nth-child(4){grid-column:3;grid-row:2}button{border:1px solid #ffd06c99;background:#1c263dcc;color:white;border-radius:14px;font-size:23px;font-weight:900;min-height:54px;touch-action:none}#act{position:absolute;right:20px;bottom:34px;pointer-events:auto;padding:12px 20px;background:#be344b;font-size:15px}#hero{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:10px;height:10px;border:1px solid #fff7;border-radius:50%}#loading{position:fixed;inset:0;background:#080915;display:grid;place-items:center;text-align:center;z-index:10}#loading h1{font-size:40px;color:#ffcb5c;font-style:italic}#loading p{color:#c9b8bd}#loading button{font-size:16px;padding:12px 25px}#loading.hidden{display:none}@media(max-width:650px){#bottom{display:none}#info{top:65px;font-size:11px;max-width:220px}#status{font-size:10px;right:8px;top:8px}#brand{top:9px;left:12px}}
</style></head><body><div id="loading"><div><h1>DIRTY CITY</h1><p>NIGHT DRIVE // 3D STREET DEMO</p><button id="start">ENTER THE CITY</button><p style="font-size:12px">A prototype, not a finished AAA game</p></div></div><div id="ui"><div id="brand">DIRTY CITY</div><div id="info">MISSION 01 / HOLIDAY HEIST<br><span id="objective">Find the glowing gold drop point.</span><br><span id="score">DELIVERIES: 0</span></div><div id="status">DIRTY // THE BOSS<br>🌙 NEON DISTRICT</div><div id="hero"></div><div id="bottom">WASD / ARROWS to drive • SPACE to brake • E to collect</div><div id="pad"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button id="act">COLLECT</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(function(){const start=document.getElementById('start');if(!window.THREE){document.querySelector('#loading p').textContent='3D engine could not load. Check your internet connection.';start.disabled=true;return}const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x080c1b);scene.fog=new T.FogExp2(0x080c1b,.009);const camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,600),renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0x8c9ed0,0x161122,1.8));const moon=new T.DirectionalLight(0xffcfa6,1.5);moon.position.set(-80,130,60);scene.add(moon);
const mat=(c,em=0)=>new T.MeshStandardMaterial({color:c,roughness:.75,metalness:.15,emissive:em,emissiveIntensity:em?.45:0});const road=mat(0x191e2c),walk=mat(0x333447),yellow=mat(0xffbe58,0xffa31b),neon=[0xff4c7e,0x38c6ff,0xf7b94d,0x8f6cff,0x50f0c5];function box(x,y,z,w,h,d,m){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}box(0,-.2,0,800,.3,800,road);
const buildings=[];for(let i=-5;i<=5;i++)for(let j=-5;j<=5;j++){const x=i*55,z=j*55;if(Math.abs(x)<24&&Math.abs(z)<24)continue;const h=16+((i*i*17+j*j*13+Math.abs(i*j)*7)%48);const color=[0x252b41,0x29273a,0x1c3340,0x3b2d43][Math.abs(i*3+j*7)%4];box(x,h/2,z,38,h,38,mat(color));buildings.push({x,z,w:38});box(x,h+.5,z,39,1,39,mat(neon[Math.abs(i+j*3)%5],neon[Math.abs(i+j*3)%5]));for(let yy=6;yy<h-2;yy+=5)for(let side of [-1,1])for(let k=-1;k<=1;k++){const glow=mat(neon[Math.abs(i+j+yy+k)%5],neon[Math.abs(i+j+yy+k)%5]);box(x+k*10,yy,z+side*19.2,4,2,.2,glow)}}
for(let i=-5;i<=5;i++){box(i*55,0.02,0,2,.06,800,walk);box(0,.02,i*55,800,.06,2,walk)}for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){const x=i*55+27,z=j*55+27;box(x,0.05,z,14,.1,14,walk)}
const car=new T.Group();scene.add(car);const body=new T.Mesh(new T.BoxGeometry(4,1.2,8),mat(0xc52d42));body.position.y=1.35;car.add(body);const roof=new T.Mesh(new T.BoxGeometry(3.3,1.2,4),mat(0x121d32));roof.position.set(0,2.25,-.6);car.add(roof);for(let x of [-2.1,2.1])for(let z of [-2.5,2.5]){const wheel=new T.Mesh(new T.CylinderGeometry(.85,.85,.5,12),mat(0x090b11));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.9,z);car.add(wheel)}for(let x of [-1.35,1.35]){const lamp=new T.Mesh(new T.BoxGeometry(.8,.3,.1),mat(0xffe4ac,0xffd78a));lamp.position.set(x,1.35,-4.06);car.add(lamp)}
car.position.set(0,0,10);let heading=0,speed=0,deliveries=0;const pickup=new T.Group();scene.add(pickup);const ring=new T.Mesh(new T.TorusGeometry(3,.35,8,36),new T.MeshBasicMaterial({color:0xffd25c}));ring.rotation.x=Math.PI/2;pickup.add(ring);const beam=new T.Mesh(new T.CylinderGeometry(1.1,1.1,14,16,1,true),new T.MeshBasicMaterial({color:0xffd25c,transparent:true,opacity:.15,side:T.DoubleSide}));beam.position.y=7;pickup.add(beam);const stops=[[0,-70],[110,-55],[-110,-110],[55,110],[-165,55]];function movePickup(){const s=stops[deliveries%stops.length];pickup.position.set(s[0],.2,s[1])}movePickup();
const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e')collect()});addEventListener('keyup',e=>keys.delete(e.key));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});document.getElementById('act').onclick=collect;function collect(){if(car.position.distanceTo(pickup.position)<13){deliveries++;document.getElementById('score').textContent='DELIVERIES: '+deliveries;document.getElementById('objective').textContent='Drop secured! Find the next gold marker.';movePickup()}else document.getElementById('objective').textContent='Drive closer to the gold marker to collect.'}
let prev=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-prev)/1000,.04);prev=now;const f=(keys.has('w')||keys.has('ArrowUp')?1:0)-(keys.has('s')||keys.has('ArrowDown')?1:0),turn=(keys.has('a')||keys.has('ArrowLeft')?1:0)-(keys.has('d')||keys.has('ArrowRight')?1:0);speed+=f*35*dt;speed*=Math.pow(keys.has(' ')? .05:.78,dt);speed=Math.max(-17,Math.min(42,speed));heading+=turn*dt*1.35*(speed>=0?1:-1)*Math.min(1,Math.abs(speed)/12);const nx=car.position.x-Math.sin(heading)*speed*dt,nz=car.position.z-Math.cos(heading)*speed*dt;const collision=buildings.some(b=>Math.abs(nx-b.x)<22&&Math.abs(nz-b.z)<23);if(!collision){car.position.x=nx;car.position.z=nz}else speed=0;car.rotation.y=heading;const behind=new T.Vector3(car.position.x+Math.sin(heading)*19,12,car.position.z+Math.cos(heading)*19);camera.position.lerp(behind,.09);camera.lookAt(car.position.x,2,car.position.z);ring.rotation.z=now*.001;pickup.position.y=.2+Math.sin(now*.003)*.4;renderer.render(scene,camera)}start.onclick=()=>{document.getElementById('loading').classList.add('hidden');prev=performance.now();requestAnimationFrame(frame)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
</script></body></html>
