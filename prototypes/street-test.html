<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DIRTY CITY | Street Prototype</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#080b15;color:white;font-family:system-ui}canvas{width:100vw;height:100dvh;display:block;touch-action:none}#hud{position:absolute;top:12px;left:12px;background:#090d19bb;padding:12px;border:1px solid #ffb84a;border-radius:9px;pointer-events:none}#hud strong{color:#ffb84a}#controls{position:absolute;bottom:18px;left:18px;display:grid;grid-template-columns:repeat(3,52px);gap:5px}button{background:#18233acc;border:1px solid #ffb84a88;color:white;border-radius:12px;min-height:52px;font-weight:900;touch-action:none}#action{position:absolute;right:20px;bottom:32px;padding:0 20px;background:#bd451e}#note{position:absolute;top:14px;right:14px;font-size:12px;color:#e9d5b7}</style>
<canvas id="city"></canvas><div id="hud"><strong>DIRTY CITY // STREET TEST</strong><div id="status">Explore the block • Find the gold marker</div><small>WASD / arrows • E to interact</small></div><div id="note">Playable prototype • not AAA</div><div id="controls"><span></span><button data-k="ArrowUp">▲</button><span></span><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div><button id="action">INTERACT</button>
<script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),keys=new Set(),p={x:180,y:180},target={x:790,y:640},blocks=[];let completed=0;
for(let y=0;y<6;y++)for(let x=0;x<7;x++)blocks.push({x:x*230+65,y:y*210+60,w:145,h:130,t:(x+y)%3});
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys.add(e.key);if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys.delete(e.key));
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});document.querySelector('#action').onclick=interact;
function interact(){if(Math.hypot(p.x-target.x,p.y-target.y)<100){completed++;document.querySelector('#status').textContent='MISSION '+completed+' COMPLETE • New pickup located';target.x=120+Math.random()*1200;target.y=120+Math.random()*900}else document.querySelector('#status').textContent='Move closer to the glowing pickup marker'}
function loop(){const w=innerWidth,h=innerHeight,dx=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0),dy=(keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('w')||keys.has('ArrowUp')?1:0),l=Math.hypot(dx,dy)||1;const nx=Math.max(10,Math.min(1600,p.x+dx/l*3.8)),ny=Math.max(10,Math.min(1300,p.y+dy/l*3.8));if(!blocks.some(b=>nx>b.x-12&&nx<b.x+b.w+12&&ny>b.y-12&&ny<b.y+b.h+12)){p.x=nx;p.y=ny}
ctx.fillStyle='#0b1020';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-p.x,h/2-p.y);
ctx.fillStyle='#171e2b';ctx.fillRect(0,0,1700,1400);ctx.strokeStyle='#f4b44b55';ctx.setLineDash([20,24]);ctx.lineWidth=2;for(let x=20;x<1700;x+=230){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,1400);ctx.stroke()}for(let y=20;y<1400;y+=210){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1700,y);ctx.stroke()}ctx.setLineDash([]);
for(const b of blocks){ctx.fillStyle=['#273049','#263a43','#443344'][b.t];ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#e27d4e';ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#ffe0a144';for(let i=0;i<4;i++)for(let j=0;j<3;j++)ctx.fillRect(b.x+14+i*32,b.y+12+j*34,12,14)}
const pulse=18+Math.sin(Date.now()/250)*5;ctx.fillStyle='#ffcb44';ctx.beginPath();ctx.arc(target.x,target.y,pulse,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.fillText('PICKUP',target.x-30,target.y-32);
ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(p.x,p.y+12,16,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff954a';ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x+4,p.y-4,3,0,Math.PI*2);ctx.fill();ctx.restore();requestAnimationFrame(loop)}loop();
</script></html>
